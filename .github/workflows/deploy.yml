name: Deploy to Vercel



on:

  push:
  
    branches:
    
      - main
      
  pull_request:
  
    branches:
    
      - main
      


jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Setup Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: '22'
          


      - name: Install pnpm
      
        uses: pnpm/action-setup@v4
        


      - name: Install dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Build latest Expo web bundle
      
        run: |
        
          rm -rf dist .vercel/output
          
          mkdir -p node_modules/react-native-css-interop/.cache
          
          : > node_modules/react-native-css-interop/.cache/web.css
          
          EXPO_USE_METRO_WORKSPACE_ROOT=1 pnpm exec expo export --platform web --output-dir dist
          


      - name: Prepare Vercel output structure
      
        run: |
        
          mkdir -p .vercel/output/static
          
          cp -r dist/. .vercel/output/static/
          
          mkdir -p ".vercel/output/functions/api/trpc/[...trpc].func"
          
          mkdir -p ".vercel/output/functions/api/couple-pdf-report.func"
          
          mkdir -p ".vercel/output/functions/api/parent-child-pdf-report.func"
          
          mkdir -p ".vercel/output/functions/api/auth/kakao/login.func"
          
          mkdir -p ".vercel/output/functions/api/auth/kakao/callback.func"
          


      - name: Build tRPC API function (with mysql2 bundled)
      
        run: |
        
          npx esbuild "api/trpc/[...trpc].ts" \
          
            --bundle \
            
            --platform=node \
            
            --target=node20 \
            
            --format=cjs \
            
            --outfile=".vercel/output/functions/api/trpc/[...trpc].func/index.js"
            


      - name: Build Kakao OAuth API functions
      
        run: |
        
          npx esbuild "api/auth/kakao/login.ts" \
          
            --bundle \
            
            --platform=node \
            
            --target=node20 \
            
            --format=cjs \
            
            --outfile=".vercel/output/functions/api/auth/kakao/login.func/index.js"
            
          npx esbuild "api/auth/kakao/callback.ts" \
          
            --bundle \
            
            --platform=node \
            
            --target=node20 \
            
            --format=cjs \
            
            --outfile=".vercel/output/functions/api/auth/kakao/callback.func/index.js"
            


      - name: Build PDF report API functions
      
        run: |
        
          npx esbuild "api/couple-pdf-report.ts" \
          
            --bundle \
            
            --platform=node \
            
            --target=node20 \
            
            --format=cjs \
            
            --external:pdfkit \
            
            --outfile=".vercel/output/functions/api/couple-pdf-r































































