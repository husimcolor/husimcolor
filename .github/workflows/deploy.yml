name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output/static
          # dist/ 폴더가 있으면 static으로 복사 (없으면 이미 커밋된 static 사용)
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/. .vercel/output/static/
          fi
          mkdir -p ".vercel/output/functions/api/trpc/[...trpc].func"

      - name: Build tRPC API function (with mysql2 bundled)
        run: |
          npx esbuild "api/trpc/[...trpc].ts" \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=cjs \
            --outfile=".vercel/output/functions/api/trpc/[...trpc].func/index.js"

      - name: Write function config
        run: |
          cat > ".vercel/output/functions/api/trpc/[...trpc].func/.vc-config.json" << 'VCEOF'
          {
            "runtime": "nodejs20.x",
            "handler": "index.js",
            "launcherType": "Nodejs",
            "shouldAddHelpers": true
          }
          VCEOF

      - name: Write Vercel output config
        run: |
          cat > .vercel/output/config.json << 'CFGEOF'
          {
            "version": 3,
            "routes": [
              { "src": "/api/trpc/(.*)", "dest": "/api/trpc/[...trpc]" },
              { "src": "/_expo/static/js/(.*)", "headers": { "Cache-Control": "public, max-age=31536000, immutable" }, "continue": true },
              { "src": "/_expo/static/css/(.*)", "headers": { "Cache-Control": "public, max-age=31536000, immutable" }, "continue": true },
              { "src": "/_expo/static/(.*)", "headers": { "Cache-Control": "public, max-age=31536000, immutable" }, "continue": true },
              { "src": "/assets/(.*)", "headers": { "Cache-Control": "public, max-age=31536000, immutable" }, "continue": true },
              { "src": "/index.html", "headers": { "Cache-Control": "no-cache, no-store, must-revalidate" }, "continue": true },
              { "handle": "filesystem" },
              { "src": "/((?!_expo/|assets/).*)", "dest": "/index.html" }
            ]
          }
          CFGEOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
