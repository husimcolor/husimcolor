name: Apply approved Production relationship conversion migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_RELATIONSHIP_CONVERSION_MIGRATION to back up schema and apply additive 0023 only"
        required: true
        type: string

jobs:
  apply:
    if: github.event.inputs.confirmation == 'APPLY_PRODUCTION_RELATIONSHIP_CONVERSION_MIGRATION'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull Production environment privately
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest env pull .env.production --environment production --yes --scope husimcolors-projects
      - name: Back up affected schema only
        env:
          PRODUCTION_ENV_FILE: .env.production
          RELATIONSHIP_CONVERSION_SCHEMA_BACKUP_FILE: relationship-conversion-schema-before.sql
          ALLOW_PRODUCTION_RELATIONSHIP_CONVERSION_MIGRATION: 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/backup-production-relationship-conversion-schema.mjs | tee schema-backup-report.json
      - name: Apply verified additive migration
        env:
          PRODUCTION_ENV_FILE: .env.production
          REMOVE_PRODUCTION_ENV_FILE: 'true'
          ALLOW_PRODUCTION_RELATIONSHIP_CONVERSION_MIGRATION: 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-production-relationship-conversion-migration.mjs | tee migration-report.json
      - name: Upload schema backup and migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-conversion-migration-report
          path: |
            schema-backup-report.json
            migration-report.json
            relationship-conversion-schema-before.sql
          if-no-files-found: ignore
          retention-days: 90
