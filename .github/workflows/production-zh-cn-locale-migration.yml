name: Apply approved Production zh-CN locale metadata migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_ZH_CN_LOCALE_MIGRATION to run the approved additive locale/copyVersion migration"
        required: true
        type: string

jobs:
  apply:
    if: github.event.inputs.confirmation == 'APPLY_PRODUCTION_ZH_CN_LOCALE_MIGRATION'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Back up affected schema only
        env:
          # Vercel intentionally redacts Production secrets during `vercel env pull`.
          # This Actions-only secret is injected into the process and never written,
          # echoed, uploaded, or exposed to a deployed client/function.
          DATABASE_URL: ${{ secrets.HUSIM_PRODUCTION_DATABASE_URL }}
          ZH_CN_LOCALE_SCHEMA_BACKUP_FILE: zh-cn-locale-schema-before.sql
          ALLOW_PRODUCTION_ZH_CN_LOCALE_MIGRATION: "true"
        shell: bash
        run: |
          set -o pipefail
          node scripts/backup-production-locale-schema.mjs | tee schema-backup-report.json
      - name: Apply additive locale metadata migration
        env:
          DATABASE_URL: ${{ secrets.HUSIM_PRODUCTION_DATABASE_URL }}
          ALLOW_PRODUCTION_ZH_CN_LOCALE_MIGRATION: "true"
        shell: bash
        run: |
          set -o pipefail
          node scripts/apply-production-locale-snapshot-metadata.mjs | tee migration-report.json
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-cn-locale-migration-report
          path: |
            migration-report.json
            schema-backup-report.json
            zh-cn-locale-schema-before.sql
          if-no-files-found: ignore
          retention-days: 90
