name: EAS Build (Preview)

# main 브랜치에 푸시될 때 자동으로 EAS 빌드 시작
# 빌드 완료 후 APK는 EAS 대시보드에서 확인 후 수동으로 스토어 제출
on:
  push:
    branches:
      - main
  # 수동 실행도 가능하도록 설정
  workflow_dispatch:
    inputs:
      profile:
        description: '빌드 프로파일 선택'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: EAS CLI 설치
        run: npm install -g eas-cli

      - name: Expo 로그인
        run: npx eas-cli whoami || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS 빌드 시작 (Android APK - preview)
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "빌드 프로파일: $PROFILE"
          npx eas-cli build \
            --platform android \
            --profile $PROFILE \
            --non-interactive \
            --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 빌드 완료 안내
        run: |
          echo "✅ EAS 빌드가 큐에 등록되었습니다."
          echo "📱 빌드 결과는 https://expo.dev/accounts/[계정명]/projects/hyusim-color/builds 에서 확인하세요."
          echo "⚠️  APK 다운로드 및 스토어 제출은 대시보드에서 수동으로 진행해 주세요."
