<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>HUSIM COLOR 샘플 리포트</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #eae5dd; color: #403833; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif; }
    #status { display: grid; place-items: center; min-height: 260px; padding: 24px; text-align: center; color: #6d6258; font-size: 13px; line-height: 1.7; }
    #status[hidden] { display: none; }
    #status strong { color: #513d2e; font-size: 15px; display: block; margin-bottom: 5px; }
    #pages { display: grid; justify-items: center; gap: 14px; padding: 8px 12px 18px; }
    .page { width: min(100%, 760px); min-height: 120px; position: relative; overflow: hidden; border-radius: 4px; background: #fff; box-shadow: 0 1px 5px rgba(64, 48, 35, .16); }
    canvas, .page-image { display: block; width: 100%; height: auto; background: #fff; }
    .page-loading { display: grid; place-items: center; min-height: 160px; padding: 16px; color: #70655a; font-size: 12px; }
    .fallback { width: min(100%, 760px); border: 1px solid #d9cda9; border-radius: 10px; background: #fff8e7; color: #70562b; padding: 11px 12px; font-size: 12px; line-height: 1.5; }
    .fallback strong { display: block; margin-bottom: 2px; }
    .error-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; }
    button { min-height:42px; border:1px solid #9cb797; border-radius:10px; background:#fff; color:#3e6a3a; padding:8px 14px; font-weight:800; }
  </style>
</head>
<body>
  <div id="status"><div><strong>첫 페이지를 불러오는 중…</strong>파일을 내려받지 않고 화면 안에서 바로 표시합니다.</div></div>
  <main id="pages" aria-live="polite"></main>
  <script type="module">
    import * as pdfjsLib from "/pdfjs/pdf.mjs";

    const reports = {
      personal_deep: { pages: 12, title: "개인 심화분석" },
      couple_love_deep: { pages: 18, title: "부부·연인 관계 분석" },
      parent_child_deep: { pages: 17, title: "부모·자녀 관계 분석" },
    };
    const params = new URLSearchParams(location.search);
    const product = params.get("product");
    const report = reports[product];
    const status = document.getElementById("status");
    const pages = document.getElementById("pages");
    const apiBase = (params.get("apiBase") || location.origin).replace(/\/$/, "");
    const zoom = Math.max(.85, Math.min(1.25, Number(params.get("zoom")) || 1));

    function pageImageUrl(page) {
      return `/sample-report-pages/${product}/page-${String(page).padStart(3, "0")}.jpg`;
    }
    function setStatus(title, body) {
      status.innerHTML = `<div><strong>${title}</strong>${body}</div>`;
    }
    function addImagePage(page, eager) {
      const image = document.createElement("img");
      image.className = "page-image";
      image.alt = `${report.title} ${page}쪽`;
      image.src = pageImageUrl(page);
      image.loading = eager ? "eager" : "lazy";
      pages.appendChild(image);
      return image;
    }
    function imageFallback(reason) {
      document.documentElement.dataset.pdfjsFallbackReason = reason;
      pages.replaceChildren();
      const notice = document.createElement("div");
      notice.className = "fallback";
      notice.innerHTML = `<strong>이미지 열람 모드</strong>이 브라우저에서 PDF.js를 사용할 수 없어, 동일한 공개 샘플의 페이지 이미지를 바로 표시합니다.`;
      pages.appendChild(notice);
      const first = addImagePage(1, true);
      first.onload = () => { status.hidden = true; };
      first.onerror = () => {
        setStatus("샘플 본문을 표시하지 못했습니다", "네트워크 상태를 확인한 뒤 다시 시도해 주세요.");
        const actions = document.createElement("div");
        actions.className = "error-actions";
        const retry = document.createElement("button");
        retry.textContent = "다시 시도";
        retry.onclick = () => location.reload();
        actions.appendChild(retry);
        status.appendChild(actions);
      };
      for (let page = 2; page <= report.pages; page += 1) addImagePage(page, false);
      console.warn("[public-sample-viewer] PDF.js fallback", reason);
    }
    async function addCanvasPage(pdf, pageNumber) {
      const shell = document.createElement("section");
      shell.className = "page";
      shell.setAttribute("aria-label", `${pageNumber}쪽`);
      shell.innerHTML = `<div class="page-loading">${pageNumber}쪽 불러오는 중…</div>`;
      pages.appendChild(shell);
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const cssWidth = Math.max(280, Math.min(760, document.documentElement.clientWidth - 24)) * zoom;
      const deviceScale = Math.min(window.devicePixelRatio || 1, 2);
      const viewport = page.getViewport({ scale: (cssWidth / baseViewport.width) * deviceScale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("CANVAS_CONTEXT_UNAVAILABLE");
      await page.render({ canvasContext: context, viewport }).promise;
      shell.replaceChildren(canvas);
    }
    async function renderPdf() {
      if (!report) {
        setStatus("샘플 리포트를 찾을 수 없습니다", "상품 선택 화면으로 돌아가 다시 시도해 주세요.");
        return;
      }
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.mjs";
        const response = await fetch(`${apiBase}/api/public-sample-report?product=${encodeURIComponent(product)}`, { cache: "no-store" });
        if (!response.ok || !response.headers.get("content-type")?.includes("application/pdf")) throw new Error("PUBLIC_SAMPLE_NOT_AVAILABLE");
        const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(await response.arrayBuffer()), useWorkerFetch: false });
        const pdf = await loadingTask.promise;
        await addCanvasPage(pdf, 1);
        status.hidden = true;
        // 첫 페이지를 실제로 보여 준 뒤 나머지 페이지를 순서대로 생성한다.
        for (let page = 2; page <= Math.min(pdf.numPages, report.pages); page += 1) {
          await new Promise(requestAnimationFrame);
          await addCanvasPage(pdf, page);
        }
      } catch (error) {
        imageFallback(error instanceof Error ? error.message : String(error));
      }
    }
    renderPdf();
  </script>
</body>
</html>
